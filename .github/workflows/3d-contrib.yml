name: Generate 3D Contribution Calendar

on:
  schedule:
    # every day at 03:30 UTC
    - cron: "30 3 * * *"
  workflow_dispatch:

# Never run at the same time as another job that writes to main.
concurrency:
  group: profile-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the tip of main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Render the calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "chore: regenerate 3d contribution calendar"
          # Rebase on anything that landed while this job was running.
          git pull --rebase origin main
          git push origin HEAD:main
